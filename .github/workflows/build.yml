name: Build apworld

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package pokemon_channel.apworld
        run: zip -r pokemon_channel.apworld pokemon_channel -x "*/__pycache__/*"

      - uses: actions/upload-artifact@v4
        with:
          name: pokemon_channel.apworld
          path: pokemon_channel.apworld

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" pokemon_channel.apworld --clobber
