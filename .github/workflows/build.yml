name: Build apworld

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package pokemon_channel.apworld
        run: zip -r pokemon_channel.apworld pokemon_channel -x "*/__pycache__/*"

      - uses: actions/upload-artifact@v4
        with:
          name: pokemon_channel.apworld
          path: pokemon_channel.apworld

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
          gh release upload "$TAG" pokemon_channel.apworld --clobber
